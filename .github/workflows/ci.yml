
name: ci

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify README exists
        run: |
          test -f README.md && echo "README present"

      - name: Show Git information
        run: |
          git --version
          echo "Branch: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
